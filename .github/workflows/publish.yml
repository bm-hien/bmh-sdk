name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Verify release version
        run: node scripts/verify-release.mjs "$GITHUB_REF_NAME"
      - name: Check SDK
        run: npm run check
      - name: Check registry version
        id: registry
        run: node scripts/check-registry.mjs >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public
      - name: Verify registry version
        run: node scripts/check-registry.mjs --require
